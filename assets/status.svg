<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2aa198"/>
      <stop offset="100%" style="stop-color:#45d6f0"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#56d364"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="160" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Border -->
  <rect x="2" y="2" width="596" height="156" fill="none" stroke="#30363d" stroke-width="1" rx="11"/>
  
  <!-- Title -->
  <text x="30" y="30" fill="#45d6f0" font-family="monospace" font-size="14" font-weight="bold">▶ STATUS</text>
  
  <!-- Progress Bars -->
  <g transform="translate(30, 45)">
    <!-- Hunting - 80% -->
    <text x="0" y="12" fill="#45d6f0" font-family="monospace" font-size="11">hunting</text>
    <rect x="100" y="2" width="340" height="14" fill="#21262d" rx="7"/>
    <rect x="100" y="2" width="272" height="14" fill="url(#bar1)" rx="7"/>
    <text x="455" y="13" fill="#45d6f0" font-family="monospace" font-size="11" font-weight="bold">80%</text>
    
    <!-- Research - 65% -->
    <text x="0" y="42" fill="#45d6f0" font-family="monospace" font-size="11">research</text>
    <rect x="100" y="32" width="340" height="14" fill="#21262d" rx="7"/>
    <rect x="100" y="32" width="221" height="14" fill="url(#bar2)" rx="7"/>
    <text x="455" y="43" fill="#3fb950" font-family="monospace" font-size="11" font-weight="bold">65%</text>
    
    <!-- Automation - 45% -->
    <text x="0" y="72" fill="#45d6f0" font-family="monospace" font-size="11">automation</text>
    <rect x="100" y="62" width="340" height="14" fill="#21262d" rx="7"/>
    <rect x="100" y="62" width="153" height="14" fill="#3fb950" rx="7"/>
    <text x="455" y="73" fill="#3fb950" font-family="monospace" font-size="11" font-weight="bold">45%</text>
    
    <!-- Documentation - 25% -->
    <text x="0" y="102" fill="#45d6f0" font-family="monospace" font-size="11">documentation</text>
    <rect x="100" y="92" width="340" height="14" fill="#21262d" rx="7"/>
    <rect x="100" y="92" width="85" height="14" fill="#2aa198" rx="7"/>
    <text x="455" y="103" fill="#2aa198" font-family="monospace" font-size="11" font-weight="bold">25%</text>
  </g>
  
  <!-- Footer -->
  <text x="30" y="148" fill="#8b949e" font-family="monospace" font-size="10" opacity="0.6">bytes_knight --status</text>
</svg>
