<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2aa198"/>
      <stop offset="100%" style="stop-color:#45d6f0"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#56d364"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="180" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Border -->
  <rect x="2" y="2" width="596" height="176" fill="none" stroke="#30363d" stroke-width="1" rx="11"/>
  
  <!-- Title -->
  <text x="30" y="35" fill="#45d6f0" font-size="16" font-family="monospace" font-weight="bold">▶ STATUS</text>
  <text x="570" y="35" text-anchor="end" fill="#3fb950" font-size="14" font-family="monospace">● active — hunting 🎯</text>
  
  <!-- Progress Bars -->
  <g transform="translate(30, 55)">
    <!-- Hunting -->
    <text x="0" y="15" fill="#45d6f0" font-size="12" font-family="monospace">[hunting]</text>
    <rect x="120" y="3" width="380" height="18" fill="#21262d" rx="4"/>
    <rect x="120" y="3" width="304" height="18" fill="url(#barGrad1)" rx="4"/>
    <text x="510" y="16" fill="#45d6f0" font-size="12" font-family="monospace" font-weight="bold">80%</text>
    
    <!-- Research -->
    <text x="0" y="45" fill="#45d6f0" font-size="12" font-family="monospace">[research]</text>
    <rect x="120" y="33" width="380" height="18" fill="#21262d" rx="4"/>
    <rect x="120" y="33" width="247" height="18" fill="url(#barGrad2)" rx="4"/>
    <text x="510" y="46" fill="#3fb950" font-size="12" font-family="monospace" font-weight="bold">65%</text>
    
    <!-- Automation -->
    <text x="0" y="75" fill="#45d6f0" font-size="12" font-family="monospace">[automation]</text>
    <rect x="120" y="63" width="380" height="18" fill="#21262d" rx="4"/>
    <rect x="120" y="63" width="171" height="18" fill="#3fb950" rx="4"/>
    <text x="510" y="76" fill="#3fb950" font-size="12" font-family="monospace" font-weight="bold">45%</text>
    
    <!-- Documentation -->
    <text x="0" y="105" fill="#45d6f0" font-size="12" font-family="monospace">[documentation]</text>
    <rect x="120" y="93" width="380" height="18" fill="#21262d" rx="4"/>
    <rect x="120" y="93" width="95" height="18" fill="#2aa198" rx="4"/>
    <text x="510" y="106" fill="#2aa198" font-size="12" font-family="monospace" font-weight="bold">25%</text>
  </g>
  
  <!-- Footer -->
  <text x="30" y="170" fill="#8b949e" font-size="10" font-family="monospace">bytes_knight --status</text>
</svg>
