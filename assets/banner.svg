<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e14"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#45d6f0"/>
      <stop offset="50%" style="stop-color:#2aa198"/>
      <stop offset="100%" style="stop-color:#45d6f0"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#56d364"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Border -->
  <rect x="2" y="2" width="1196" height="316" fill="none" stroke="#30363d" stroke-width="2" rx="15"/>
  
  <!-- Decorative top line -->
  <line x1="100" y1="60" x2="1100" y2="60" stroke="#45d6f0" stroke-width="1" opacity="0.3"/>
  
  <!-- Main Title - BYTES KNIGHT -->
  <text x="600" y="170" text-anchor="middle" 
        fill="url(#textGrad)" 
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="82" 
        font-weight="bold"
        letter-spacing="12"
        filter="url(#glow)">
    BYTES KNIGHT
  </text>
  
  <!-- Subtitle line -->
  <line x1="300" y1="200" x2="900" y2="200" stroke="#30363d" stroke-width="1"/>
  
  <!-- Tagline -->
  <text x="600" y="240" text-anchor="middle" fill="url(#tagGrad)" 
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="18" 
        letter-spacing="3">
    offensive security • bug bounty hunter • security researcher
  </text>
  
  <!-- Decorative bottom accent -->
  <circle cx="600" cy="280" r="4" fill="#45d6f0" opacity="0.6"/>
  <circle cx="580" cy="280" r="2" fill="#3fb950" opacity="0.4"/>
  <circle cx="620" cy="280" r="2" fill="#3fb950" opacity="0.4"/>
</svg>
